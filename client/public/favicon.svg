<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlgoArena favicon">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11182B"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="mark" x1="18" y1="47" x2="46" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g opacity="0.18" fill="#94A3B8">
    <circle cx="16" cy="16" r="1.1"/>
    <circle cx="48" cy="16" r="1.1"/>
    <circle cx="16" cy="48" r="1.1"/>
    <circle cx="48" cy="48" r="1.1"/>
  </g>

  <!-- abstract A / route graph -->
  <g filter="url(#softGlow)">
    <path d="M18 46 L32 18 L46 46" stroke="url(#mark)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 35 H40" stroke="url(#mark)" stroke-width="4.8" stroke-linecap="round"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="32" cy="18" r="3.6" fill="#F8FAFC"/>
    <circle cx="18" cy="46" r="3.6" fill="#F8FAFC"/>
    <circle cx="46" cy="46" r="3.6" fill="#F8FAFC"/>
    <circle cx="32" cy="35" r="2.7" fill="#22D3EE"/>
    <circle cx="32" cy="35" r="1.15" fill="#F8FAFC"/>
  </g>
</svg>
